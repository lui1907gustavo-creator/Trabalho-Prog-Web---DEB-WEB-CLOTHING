<!DOCTYPE HTML>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!--padrão de caracteres-->
    <meta name="Projeto Grau A - Dev WEb">
    <!--fornecimento de dados de busca para o navegador-->
    <link rel="stylesheet" href="style.css">
    <title>Projeto Grau A</title>
</head>

<body bgcolor="#e8e4dc">
    <!-- ===== Barra de aviso/promoção no topo do site ===== -->
    <!-- Igual à da Home: faixa preta com texto correndo (animação no CSS) -->
    <div id="borda">
        <span id="textodentrodabarra"> Todo o site em 10x sem juros - Compras acima de R$ 300,00 com frete grátis</span>
    </div>

    <!-- ===== Menu de navegação principal (repetido em todas as páginas) ===== -->
    <nav class="navbar">
        <!-- Logo da loja / link para a Home -->
        <div class="logo">
            <a href="pjt ga.html">
                <img src="V1.png" alt="Logo da loja">
            </a>
        </div>
        <!-- Links de navegação (Home / Produtos) -->
        <div class="navlinks">
            <a class="linksdabarra" href="pjt ga.html">Home</a>
            <a class="linksdabarra" href="produtos.html">Produtos</a>
            <a class="linksdabarra" href="institucional.html">Institucional</a>
            <a class="linksdabarra" href="sac.html">Fale Conosco</a>
        </div>
    </nav>

    <!-- ===== Título da página de produtos ===== -->
    <h1 class="h1">Coleção</h1>
    <!-- Linha de destaque (cor de acento) logo abaixo do título -->
    <hr class="hr">

    <!-- ===== Grade (grid) com todos os produtos ===== -->
    <div class="itens">

        <!-- Cada .card é um produto: imagem clicável + nome -->
        <div class="card">
            <a href="camiseta.html">
                <img src="Camiseta.svg" alt="Camiseta Oversized">
            </a>
            <p class="p">Camiseta Oversized</p>
        </div>

        <div class="card">
            <a href="link do produto">
                <img src="Five Panel.svg" alt="Five Panel">
            </a>
            <p class="p">Five Panel</p>
        </div>

        <div class="card">
            <a href="link do produto">
                <img src="Puffer.svg" alt="Jaqueta Puffer">
            </a>
            <p class="p">Jaqueta Puffer</p>
        </div>

        <div class="card">
            <a href="link do produto">
                <img src="Caneca.svg" alt="Caneca">
            </a>
            <p class="p">Caneca</p>
        </div>

        <div class="card">
            <a href="link do produto">
                <img src="Termica.svg" alt="Garrafa Térmica">
            </a>
            <p class="p">Garrafa Térmica</p>
        </div>

        <!-- Para adicionar um novo produto, basta copiar um bloco .card acima,
             trocar a imagem, o link e o texto do <p> -->

    </div>

    <!-- ===== Rodapé, igual ao da Home ===== -->
    <footer class="rodape">
        &copy; Projeto Grau A
    </footer>

</body>

</html>

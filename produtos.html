<!DOCTYPE HTML>

<head>

<body bgcolor="#e8e4dc">
    <!-- ===== Barra de aviso/promoção no topo do site ===== -->
    <!-- Igual à da Home: faixa preta com texto correndo (animação no CSS) -->
    <div id="borda">
        <span id="textodentrodabarra"> Todo o site em 10x sem juros - Compras acima de R$ 300,00 com frete grátis</span>
    </div>

    <!-- ===== Menu de navegação principal (repetido em todas as páginas) ===== -->

        <div class="logo">

        <!-- Links de navegação (Home / Produtos) -->

    <!-- ===== Título da página de produtos ===== -->

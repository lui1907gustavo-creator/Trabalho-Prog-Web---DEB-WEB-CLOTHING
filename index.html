<!DOCTYPE html>
<!-- Documento em português do Brasil -->
<html lang="pt-BR">

<head>
    <!-- Define a codificação de caracteres do documento (acentos, cedilha, etc.) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Descrição usada por buscadores (SEO) -->
    <meta name="description" content="Projeto Grau A - Dev Web">

    <!-- Importa a folha de estilos que define toda a aparência do site -->
    <link rel="stylesheet" href="style.css">

    <!-- Título exibido na aba do navegador -->
    <title>Projeto Grau A</title>
</head>

<body bgcolor="#e8e4dc">
    <!-- ===== Barra de aviso/promoção no topo do site ===== -->
    <!-- Faixa preta fixa no topo com o texto correndo (animação definida no CSS) -->
    <div id="borda">
        <!-- Texto que se move da direita para a esquerda via @keyframes "passar" -->
        <span id="textodentrodabarra">
            Todo o site em 10x sem juros - Compras acima de R$ 300,00 com frete grátis
        </span>
    </div>

    <!-- ===== Menu de navegação principal ===== -->
    <nav class="navbar">

        <!-- Logo da loja, também funciona como link para a Home -->
        <div class="logo">
            <a href="index.html">
                <img src="V1.png" alt="Logo da loja">
            </a>
        </div>

        <!-- Links de navegação (Home / Produtos) -->
        <div class="navlinks">
            <a class="linksdabarra" href="index.html">Home</a>
            <a class="linksdabarra" href="produtos.html">Produtos</a>
            <a class="linksdabarra" href="institucional.html">Institucional</a>
            <a class="linksdabarra" href="sac.html">Fale Conosco</a>


        </div>

    </nav>

    <!-- ===== Carrossel de destaque da Home ===== -->
    <!-- Trilho horizontal com "encaixe" de slide (scroll-snap); a seta avança um slide por clique -->
    <section class="hero">
        <div class="hero-track" id="heroTrack">
            <div class="hero-slide">
                <img src="hero1.jpg" alt="Camiseta estilizada da coleção">
            </div>
        </div>

        <button class="hero-arrow" id="heroNext" aria-label="Ver próximo destaque">
            &#10095;
        </button>
    </section>

    <!-- ===== Rodapé, presente em todas as páginas ===== -->
    <footer class="rodape">
        &copy; Projeto Grau A
    </footer>

</body>

</html>
